version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: halfnote-db
    environment:
      POSTGRES_DB: halfnote_db
      POSTGRES_USER: halfnote_user
      POSTGRES_PASSWORD: halfnote_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U halfnote_user -d halfnote"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: halfnote-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
